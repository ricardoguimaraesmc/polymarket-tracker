name: Polymarket Whale Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      min_usd:
        description: "Minimal USD buat dianggap whale"
        required: false
        default: "5000"

permissions:
  contents: read
  actions: read

concurrency:
  group: whale-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Restore the latest persisted SQLite database.
      - name: Download previous database
        uses: dawidd6/action-download-artifact@v23
        with:
          workflow: tracker.yml
          workflow_conclusion: success
          name: tracker-db
          path: .
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 whale_tracker.py poll             --min-usd "${{ github.event.inputs.min_usd || '5000' }}"             --smart --min-pnl 5000 --min-winrate 0.55             --spike-usd 25000 --spike-window 30             --consensus-wallets 3 --consensus-window 60 --consensus-min-usd 1000

      - name: Upload current database
        uses: actions/upload-artifact@v4
        with:
          name: tracker-db
          path: tracker.db
          retention-days: 90
          overwrite: true

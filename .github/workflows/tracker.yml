name: Polymarket Whale Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      min_usd:
        description: "Minimal USD para considerado whale"
        required: false
        default: "5000"

permissions:
  contents: read

concurrency:
  group: whale-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore tracker state
        uses: actions/cache@v4
        with:
          path: |
            tracker.db
            .polymarket_market_cache.json
          key: tracker-db-${{ github.run_id }}
          restore-keys: |
            tracker-db-

      - name: Run poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 whale_tracker.py poll \
            --min-usd "${{ github.event.inputs.min_usd || '5000' }}" \
            --smart --min-pnl 5000 --min-winrate 0.55 \
            --spike-usd 25000 --spike-window 30 \
            --consensus-wallets 3 --consensus-window 60 --consensus-min-usd 1000
